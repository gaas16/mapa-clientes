<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Clientes - Grupo Privado</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Geocoder CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #f4f6f9; 
    }
    
    /* Pantalla de Login / Registro */
    #auth-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #2c3e50;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3000;
    }

    .auth-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    .auth-card h2 { margin-top: 0; color: #2c3e50; margin-bottom: 20px; }
    .auth-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .auth-card button {
      width: 100%;
      padding: 10px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      margin-top: 5px;
    }

    .auth-card button.btn-secondary {
      background: #3498db;
      margin-top: 8px;
    }

    .auth-error { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }

    /* Contenedor del Mapa */
    #map { height: 100vh; width: 100%; position: relative; display: none; }
    
    /* Panel Flotante del Mapa / Adaptable a Móviles */
    .filter-container {
      position: absolute;
      top: 10px;
      right: 10px;
      left: 10px;
      max-width: 450px;
      margin: 0 auto;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
    }

    .filter-btn {
      border: none;
      padding: 8px 10px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 11px;
      color: white;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    .btn-all { background-color: #2c3e50; }
    .btn-bueno { background-color: #2ecc71; }
    .btn-regular { background-color: #e67e22; }
    .btn-malo { background-color: #e74c3c; }
    .btn-logout { background-color: #7f8c8d; }

    .instruction-banner {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      text-align: center;
      width: 80%;
      max-width: 320px;
    }

    /* Modal Formulario */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 { margin-top: 0; color: #333; margin-bottom: 15px; font-size: 18px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-save { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; width: 50%; font-weight: bold; cursor: pointer; }
    .btn-cancel { background: #95a5a6; color: white; border: none; padding: 10px; border-radius: 6px; width: 50%; font-weight: bold; cursor: pointer; }

    /* Estilos PopUp Mapa */
    .leaflet-popup-content-wrapper {
      padding: 10px !important;
      border-radius: 12px !important;
    }
    .leaflet-popup-content {
      font-size: 13px !important;
      line-height: 1.4 !important;
      margin: 8px 10px !important;
      min-width: 240px !important;
      max-width: 280px !important;
    }
    .leaflet-popup-content b,
    .leaflet-popup-content strong {
      font-size: 14px !important;
      display: inline-block;
    }
    .img-fachada {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
    }

    /* Seccion de Reseñas y Estrellas */
    .reviews-section {
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 8px;
    }
    .star-rating {
      color: #f1c40f;
      font-size: 16px;
    }
    .review-item {
      background: #f8f9fa;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 11px;
      border-left: 3px solid #f1c40f;
    }
    .review-item strong { font-size: 11px !important; color: #2c3e50; }
    .review-form select, .review-form textarea {
      width: 100%;
      padding: 6px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-bottom: 6px;
      box-sizing: border-box;
    }
    .btn-review {
      background: #27ae60;
      color: white;
      border: none;
      padding: 6px;
      width: 100%;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Login / Registro Obligatorio -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">Acceso al Grupo</h2>
      <input type="email" id="authEmail" placeholder="Correo Electrónico">
      <input type="password" id="authPassword" placeholder="Contraseña">
      
      <button id="btnLogin" onclick="iniciarSesion()">Iniciar Sesión</button>
      <button id="btnRegister" class="btn-secondary" onclick="registrarse()">Registrarse</button>
      
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <!-- Contenedor del Mapa -->
  <div id="map">
    <!-- Panel Control Superior con Filtros -->
    <div class="filter-container">
      <button class="filter-btn btn-all" onclick="filtrarMapa('TODOS')">Todos</button>
      <button class="filter-btn btn-bueno" onclick="filtrarMapa('BUENO')">Buenos</button>
      <button class="filter-btn btn-regular" onclick="filtrarMapa('REGULAR')">Regulares</button>
      <button class="filter-btn btn-malo" onclick="filtrarMapa('MALO')">Malos</button>
      <button class="filter-btn btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>

    <!-- Instrucción visual -->
    <div class="instruction-banner">
      🔍 Busca dirección o haz <b>doble clic</b> para agregar cliente
    </div>
  </div>

  <!-- Modal Formulario Agregar Cliente -->
  <div class="modal-overlay" id="modalForm">
    <div class="modal-content">
      <h3>➕ Agregar Nuevo Cliente</h3>
      
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="inputNombre" placeholder="Ej: María Silva">
      </div>

      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="inputDireccion" placeholder="Ej: Av. Boqueirão, 1947">
      </div>
      
      <div class="form-group">
        <label>Calificación</label>
        <select id="inputCalificacion">
          <option value="BUENO">BUENO (Verde)</option>
          <option value="REGULAR">REGULAR (Naranja)</option>
          <option value="MALO">MALO (Rojo)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Monto Solicitado ($)</label>
        <input type="number" id="inputMonto" placeholder="Ej: 3000">
      </div>

      <div class="form-group">
        <label>Score Crédito</label>
        <input type="number" id="inputScore" placeholder="Ej: 750" value="0">
      </div>

      <div class="form-group">
        <label>Motivo / Observación</label>
        <input type="text" id="inputMotivo" placeholder="Ej: Pago puntual">
      </div>

      <div class="form-group">
        <label>Foto Fachada del Negocio</label>
        <input type="file" id="inputFoto" accept="image/*">
      </div>

      <div class="form-actions">
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-save" id="btnGuardar" onclick="guardarNuevoCliente()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Formulario Editar Cliente (Solo Admin) -->
  <div class="modal-overlay" id="modalEditForm">
    <div class="modal-content">
      <h3>✏️ Editar Cliente (Admin)</h3>
      <input type="hidden" id="editClienteId">
      <input type="hidden" id="editFotoUrlActual">
      
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="editNombre">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="editDireccion">
      </div>
      <div class="form-group">
        <label>Calificación</label>
        <select id="editCalificacion">
          <option value="BUENO">BUENO (Verde)</option>
          <option value="REGULAR">REGULAR (Naranja)</option>
          <option value="MALO">MALO (Rojo)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Monto Solicitado ($)</label>
        <input type="number" id="editMonto">
      </div>
      <div class="form-group">
        <label>Score Crédito</label>
        <input type="number" id="editScore">
      </div>
      <div class="form-group">
        <label>Motivo / Observación</label>
        <input type="text" id="editMotivo">
      </div>
      <div class="form-group">
        <label>Actualizar / Subir Foto Fachada</label>
        <input type="file" id="editFoto" accept="image/*">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="cerrarModalEdit()">Cancelar</button>
        <button class="btn-save" id="btnEditarGuardar" onclick="guardarCambiosCliente()">Guardar Cambios</button>
      </div>
    </div>
  </div>
  
  <!-- Leaflet JS & Geocoder -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, deleteDoc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCpY9ycS8APh6xGGsPd3BKF5A2xGLtch9E",
      authDomain: "creditomapa-7083e.firebaseapp.com",
      projectId: "creditomapa-7083e",
      storageBucket: "creditomapa-7083e.firebasestorage.app",
      messagingSenderId: "353134326446",
      appId: "1:353134326446:web:0b9c9cb22c34627346333f",
      measurementId: "G-HNVLR8YOWE"
    };

    const IMGBB_API_KEY = "53cb3b5f48ad867ea85a7d7af569ab02";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let map = null;
    let listaMarcadores = [];
    let coordenadasTemp = null;
    let usuarioActual = null;

    // Iconos Leaflet
    const greenIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const orangeIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // Control de Estado de Autenticación
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        usuarioActual = user;
        try {
          const docSnap = await getDoc(doc(db, "sesiones_activas", user.uid));
          const tokenBD = docSnap.exists() ? docSnap.data().token : null;
          const tokenLocal = localStorage.getItem("tokenSesion");

          if (tokenBD && tokenLocal && tokenLocal !== tokenBD) {
            localStorage.removeItem("tokenSesion");
            alert("⚠️ Se ha iniciado sesión desde otro dispositivo. Tu sesión en este equipo ha sido cerrada.");
            await signOut(auth);
            return;
          }

          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('map').style.display = 'block';
          if (!map) inicializarMapa();
          cargarClientes();

        } catch (error) {
          console.error("Error verificando sesión:", error);
        }
      } else {
        usuarioActual = null;
        localStorage.removeItem("tokenSesion");
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('map').style.display = 'none';
      }
    });

    window.iniciarSesion = async function() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      mostrarError("");
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        const nuevoTokenSesion = Date.now().toString();
        await setDoc(doc(db, "sesiones_activas", user.uid), { token: nuevoTokenSesion });
        localStorage.setItem("tokenSesion", nuevoTokenSesion);

      } catch (err) {
        mostrarError("Error de acceso: " + err.message);
      }
    };

    window.registrarse = async function() {
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      mostrarError("");
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const user = userCredential.user;

        const nuevoTokenSesion = Date.now().toString();
        await setDoc(doc(db, "sesiones_activas", user.uid), { token: nuevoTokenSesion });
        localStorage.setItem("tokenSesion", nuevoTokenSesion);

      } catch (err) {
        mostrarError("Error en registro: " + err.message);
      }
    };

    window.cerrarSesion = function() {
      signOut(auth);
    };

    function mostrarError(msg) {
      const errDiv = document.getElementById('authError');
      errDiv.innerText = msg;
      errDiv.style.display = msg ? 'block' : 'none';
    }

    function inicializarMapa() {
      map = L.map('map', { doubleClickZoom: false }).setView([-29.9189, -51.1781], 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      L.Control.geocoder({
        defaultMarkGeocode: false,
        placeholder: "Escribe calle y número..."
      })
      .on('markgeocode', function(e) {
        map.setView(e.geocode.center, 17);
      })
      .addTo(map);

      map.on('dblclick', function(e) {
        coordenadasTemp = e.latlng;
        document.getElementById('modalForm').style.display = 'flex';
      });
    }

    function calcularPromedioEstrellas(resenas = []) {
      if (!resenas.length) return { promedio: 0, total: 0, estrellasHtml: "☆☆☆☆☆" };
      const suma = resenas.reduce((acc, r) => acc + (r.estrellas || 0), 0);
      const promedio = (suma / resenas.length).toFixed(1);
      
      const numEstrellas = Math.round(promedio);
      const estrellasHtml = "★".repeat(numEstrellas) + "☆".repeat(5 - numEstrellas);

      return { promedio, total: resenas.length, estrellasHtml };
    }

    function agregarMarcadorAlMapa(data) {
      const calificacion = (data.calificacion || "").toUpperCase();
      let colorEstado = 'red';
      let icono = redIcon;

      if (calificacion === 'BUENO') {
        colorEstado = 'green';
        icono = greenIcon;
      } else if (calificacion === 'REGULAR') {
        colorEstado = 'orange';
        icono = orangeIcon;
      }

      const marker = L.marker([data.lat, data.lng], { icon: icono }).addTo(map);
      const direccionTexto = data.direccion ? `<br><b>Dirección:</b> ${data.direccion}` : '';
      const fotoHtml = data.fotoUrl ? `<img src="${data.fotoUrl}" class="img-fachada" alt="Fachada" />` : '';

      const resenas = data.resenas || [];
      const infoEstrellas = calcularPromedioEstrellas(resenas);

      let resenasHtml = resenas.slice(-3).reverse().map(r => `
        <div class="review-item">
          <strong>${r.usuario || 'Usuario'}:</strong> ${'★'.repeat(r.estrellas)}<br>
          ${r.comentario}
        </div>
      `).join('');

      if (!resenasHtml) {
        resenasHtml = '<div style="font-size:11px; color:#777;">Sin comentarios aún.</div>';
      }

      const dataJson = JSON.stringify(data).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

      const popupContent = `
        <div style="font-size:13px; line-height:1.4;">
          ${fotoHtml}
          <b style="text-transform:uppercase;">${data.nombre || 'Cliente sin nombre'}</b><br>
          <div style="margin: 4px 0;">
            <span class="star-rating">${infoEstrellas.estrellasHtml}</span> 
            <b>${infoEstrellas.promedio}</b> (${infoEstrellas.total} resenas)
          </div>
          <b>Estado:</b> <span style="color:${colorEstado}; font-weight:bold;">${calificacion || 'N/A'}</span><br>
          <b>Monto solicitado:</b> $${data.monto_solicitado || 0}<br>
          <b>Score:</b> ${data.score_credito ?? 'N/A'}<br>
          <b>Motivo:</b> ${data.motivo || 'N/A'}
          ${direccionTexto}
          
          <div class="reviews-section">
            <b style="font-size:12px;">💬 Comentarios del equipo:</b>
            <div style="max-height: 100px; overflow-y: auto; margin-top:5px;">
              ${resenasHtml}
            </div>
            
            <div class="review-form" style="margin-top:8px;">
              <b style="font-size:11px;">Añadir Calificación:</b>
              <select id="stars_${data.id}">
                <option value="5">★★★★★ (5/5)</option>
                <option value="4">★★★★☆ (4/5)</option>
                <option value="3">★★★☆☆ (3/5)</option>
                <option value="2">★★☆☆☆ (2/5)</option>
                <option value="1">★☆☆☆☆ (1/5)</option>
              </select>
              <textarea id="comment_${data.id}" rows="2" placeholder="Escribe un comentario sobre este cliente..."></textarea>
              <button class="btn-review" onclick="event.stopPropagation(); enviarCalificacion('${data.id}')">⭐ Guardar Opinión</button>
            </div>
          </div>

          <br>
          <button onclick='event.stopPropagation(); abrirModalEditarProtected(${dataJson})' style="background-color: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 11px; margin-bottom: 6px;">
            ✏️ Editar Cliente (Admin)
          </button>
          <button onclick="event.stopPropagation(); eliminarCliente('${data.id}')" style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 11px;">
            🗑️ Eliminar Cliente (Admin)
          </button>
        </div>
      `;
      marker.bindPopup(popupContent);
      listaMarcadores.push({instanciaMarker: marker, categoria: calificacion || 'MALO' });
    }

    window.enviarCalificacion = async function(clienteId) {
      const selectStars = document.getElementById(`stars_${clienteId}`);
      const textComment = document.getElementById(`comment_${clienteId}`);

      const estrellas = parseInt(selectStars.value);
      const comentario = textComment.value.trim();

      if (!comentario) {
        alert("Por favor escribe un comentario.");
        return;
      }

      const usuarioNombre = usuarioActual ? usuarioActual.email.split('@')[0] : 'Usuario';

      const nuevaResena = {
        usuario: usuarioNombre,
        estrellas: estrellas,
        comentario: comentario,
        fecha: new Date().toISOString()
      };

      try {
        await updateDoc(doc(db, "clientes", clienteId), {
          resenas: arrayUnion(nuevaResena)
        });
        alert("⭐ Opinión guardada correctamente");
        cargarClientes();
      } catch (error) {
        console.error("Error al guardar reseña:", error);
        alert("Hubo un error al publicar tu comentario: " + error.message);
      }
    };

    window.eliminarCliente = async function (id) {
      if (!id) {
        alert("❌ Error: No se encontró el ID del cliente.");
        return;
      }

      const CLAVE_ADMIN = "1098";
      const passwordIngresada = prompt("⚠️ Acción protegida\nIngresa la contraseña de administrador para eliminar:");

      if (passwordIngresada === null) return;

      if (passwordIngresada !== CLAVE_ADMIN) {
        alert("❌ Contraseña incorrecta. No tienes permiso para eliminar.");
        return;
      }

      if (confirm("¿Estás seguro de que deseas eliminar este cliente del mapa?")) {
        try {
          await deleteDoc(doc(db, "clientes", id.trim()));
          alert("✅ Cliente eliminado con éxito");
          cargarClientes();
        } catch (error) {
          console.error("Error al eliminar cliente:", error);
          alert("Hubo un error al intentar eliminar el cliente: " + error.message);
        }
      }
    };

    async function cargarClientes() {
      listaMarcadores.forEach(m => map.removeLayer(m.instanciaMarker));
      listaMarcadores = [];

      try {
        const querySnapshot = await getDocs(collection(db, "clientes"));
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          data.id = doc.id;
          if (data.lat && data.lng) {
            agregarMarcadorAlMapa(data);
          }
        });
      } catch (error) {
        console.error("Error cargando clientes:", error);
      }
    }

    async function subirImagenImgBB(file) {
      if (!file) return null;
      const formData = new FormData();
      formData.append("image", file);

      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error("Error al subir la imagen a ImgBB");
      }
    }

    window.guardarNuevoCliente = async function() {
      const nombre = document.getElementById('inputNombre').value.trim();
      const direccion = document.getElementById('inputDireccion').value.trim();
      const calificacion = document.getElementById('inputCalificacion').value;
      const monto = parseFloat(document.getElementById('inputMonto').value) || 0;
      const score = parseInt(document.getElementById('inputScore').value) || 0;
      const motivo = document.getElementById('inputMotivo').value.trim();
      const fotoFile = document.getElementById('inputFoto').files[0];

      if (!nombre) {
        alert("Por favor ingresa el nombre del cliente");
        return;
      }

      const btnGuardar = document.getElementById('btnGuardar');
      btnGuardar.disabled = true;
      btnGuardar.innerText = "Subiendo foto y guardando...";

      try {
        let fotoUrl = "";
        if (fotoFile) {
          fotoUrl = await subirImagenImgBB(fotoFile);
        }

        const nuevoCliente = {
          nombre: nombre,
          direccion: direccion,
          calificacion: calificacion,
          monto_solicitado: monto,
          score_credito: score,
          motivo: motivo,
          fotoUrl: fotoUrl,
          lat: coordenadasTemp.lat,
          lng: coordenadasTemp.lng,
          resenas: []
        };

        const docRef = await addDoc(collection(db, "clientes"), nuevoCliente);
        nuevoCliente.id = docRef.id;
        agregarMarcadorAlMapa(nuevoCliente);
        cerrarModal();
      } catch (error) {
        alert("Error al guardar: " + error.message);
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = "Guardar";
      }
    };

    window.cerrarModal = function() {
      document.getElementById('modalForm').style.display = 'none';
      document.getElementById('inputNombre').value = '';
      document.getElementById('inputDireccion').value = '';
      document.getElementById('inputMonto').value = '';
      document.getElementById('inputScore').value = '0';
      document.getElementById('inputMotivo').value = '';
      document.getElementById('inputFoto').value = '';
    };

    window.filtrarMapa = function(tipo) {
      listaMarcadores.forEach(item => {
        if (tipo === 'TODOS' || item.categoria === tipo) {
          if (!map.hasLayer(item.instanciaMarker)) {
            map.addLayer(item.instanciaMarker);
          }
        } else {
          if (map.hasLayer(item.instanciaMarker)) {
            map.removeLayer(item.instanciaMarker);
          }
        }
      });
    };

    window.abrirModalEditarProtected = function(cliente) {
      const CLAVE_ADMIN = "1098";
      const passwordIngresada = prompt("⚠️ Acción protegida\nIngresa la contraseña de administrador para editar:");

      if (passwordIngresada === null) return;
      if (passwordIngresada !== CLAVE_ADMIN) {
        alert("❌ Contraseña incorrecta. No tienes permiso para editar.");
        return;
      }

      document.getElementById('editClienteId').value = cliente.id;
      document.getElementById('editFotoUrlActual').value = cliente.fotoUrl || '';
      document.getElementById('editNombre').value = cliente.nombre || '';
      document.getElementById('editDireccion').value = cliente.direccion || '';
      document.getElementById('editCalificacion').value = cliente.calificacion || 'BUENO';
      document.getElementById('editMonto').value = cliente.monto_solicitado || 0;
      document.getElementById('editScore').value = cliente.score_credito || 0;
      document.getElementById('editMotivo').value = cliente.motivo || '';
      document.getElementById('editFoto').value = '';
      
      document.getElementById('modalEditForm').style.display = 'flex';
    };

    window.cerrarModalEdit = function() {
      document.getElementById('modalEditForm').style.display = 'none';
    };

    window.guardarCambiosCliente = async function() {
      const id = document.getElementById('editClienteId').value;
      if (!id) {
        alert("Error: No se encontró el ID del cliente.");
        return;
      }

      const btnEditar = document.getElementById('btnEditarGuardar');
      btnEditar.disabled = true;
      btnEditar.innerText = "Subiendo foto y guardando...";

      try {
        const fotoNueva = document.getElementById('editFoto').files[0];
        let fotoUrl = document.getElementById('editFotoUrlActual').value;

        if (fotoNueva) {
          fotoUrl = await subirImagenImgBB(fotoNueva);
        }

        const datosActualizados = {
          nombre: document.getElementById('editNombre').value.trim(),
          direccion: document.getElementById('editDireccion').value.trim(),
          calificacion: document.getElementById('editCalificacion').value,
          monto_solicitado: parseFloat(document.getElementById('editMonto').value) || 0,
          score_credito: parseInt(document.getElementById('editScore').value) || 0,
          motivo: document.getElementById('editMotivo').value.trim(),
          fotoUrl: fotoUrl
        };

        await updateDoc(doc(db, "clientes", id), datosActualizados);
        alert("✅ Cliente actualizado con éxito");
        cerrarModalEdit();
        cargarClientes();
      } catch (error) {
        console.error("Error al actualizar cliente:", error);
        alert("Hubo un error al guardar los cambios: " + error.message);
      } finally {
        btnEditar.disabled = false;
        btnEditar.innerText = "Guardar Cambios";
      }
    };
  </script>
</body>
